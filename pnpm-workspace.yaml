overrides:
  vite: ^8

allowBuilds:
  sharp: true
  esbuild: false

# Keep in sync with renovate.json "minimumReleaseAge" (3 days = 4320 min) so
# Renovate-generated lockfiles always satisfy pnpm's install-time policy.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Renovate security update: sharp@0.35.0 || 0.35.4
  - sharp@0.35.0 || 0.35.4
  # Renovate security update: astro@7.4.7
  - astro@7.4.7
  # Published 2026-11-13 ~19:00Z, still inside the 3-day window on 2026-11-16.
  # @astrojs/vite-plugin-astro is a transitive dependency of astro@7.4.12.
  - astro@7.4.12
  - "@astrojs/mdx@8.1.6"
  - "@astrojs/markdown-satteri@0.4.10"
  - "@astrojs/vite-plugin-astro@0.1.3"
